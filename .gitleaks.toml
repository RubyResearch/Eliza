# gitleaks configuration — elizaOS workspace
# SOC2 CC7.1 (monitoring) — automated secret-detection at the SCM boundary.
#
# Uses the upstream default ruleset and layers on workspace-specific allowlist
# entries. To rebuild the embedded default rules, see:
#   https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "elizaOS gitleaks config"

[extend]
# Pull in upstream default ruleset.
useDefault = true

# Provider trajectory tests intentionally repeat this invented credential to
# verify that full recorded text still redacts configured secrets. Match only
# this fixture in its owning test; all other values remain scanned.
[[allowlists]]
description = "Provider trajectory recording synthetic redaction canary"
condition = "AND"
paths = [
  '''(^|/)packages/core/src/__tests__/compose-state-trajectory-recording\.test\.ts$''',
]
regexTarget = "secret"
regexes = [
  '''^sk-trajectory-recording-secret-canary-1234567890$''',
]

# Android routing audits pin the SHA-256 of the complete public analytics script
# shipped by @coinbase/wallet-sdk 4.3.6. This is an integrity digest, not an access
# token. Match only this digest in its owning file; other values remain scanned.
[[allowlists]]
description = "Public Coinbase SDK analytics script integrity digest"
condition = "AND"
paths = [
  '''^packages/app-core/scripts/lib/android-cloud-routing-markers\.mjs$''',
]
regexTarget = "secret"
regexes = [
  '''^373bcdaea9398c1f586404f0a39045e09a11949d361ec9c58a46ca5e010f75a4$''',
]

# Allowlists for known false positives only. Entries here MUST be reviewed —
# never add a real secret pattern. Prefer narrow path scopes over broad regexes.
[[allowlists]]
description = "Test fixtures and example placeholders"
paths = [
  '''(^|/)__fixtures__/''',
  '''(^|/)__mocks__/''',
  '''(^|/)test/fixtures/''',
  '''(^|/)tests/fixtures/''',
  '''(^|/)tests/e2e/.*\.spec\.ts$''',
  '''.*\.example$''',
  '''\.env\.example$''',
  '''\.env\.sample$''',
  '''docs/.*\.mdx?$''',
]

# The secret-swap PII detector suites (#10469) MUST embed example secret SHAPES
# (a Stripe-style key, a GCP key, a JWT, …) to prove the detectors fire — none
# are real credentials. Narrow per-file scope, not a broad regex.
[[allowlists]]
description = "secret-swap PII detector test fixtures — example secret shapes under test (#10469)"
paths = [
  '''packages/core/src/security/pii-detectors\.test\.ts$''',
  '''packages/core/src/security/pii-detectors-extended\.test\.ts$''',
  '''packages/core/src/security/secret-swap\.redteam\.test\.ts$''',
  '''packages/core/src/security/secret-swap\.fuzz\.test\.ts$''',
  '''packages/core/src/security/secret-swap\.bench\.ts$''',
  '''packages/core/src/security/guarded-stream\.test\.ts$''',
  '''test-results/evidence/10469-live-model/.*''',
]

# The warm-pool claim-time key-push tests once embedded plain `eliza_`-prefixed
# synthetic fixtures; current files assemble them by concatenation, so no
# token-shaped literal remains for the scanner to match. These two historical
# commits still carry the plain shapes in their diffs — allowlist the exact
# commits (never a path or regex), so every current and future line stays
# scanned.
[[allowlists]]
description = "historical warm-pool synthetic key fixtures (#17066/#17078) — literals since removed from the tree"
commits = [
  "7cd6e85aeba85a7da858cfb6ed70bf74d8a876a6",
  "82694fe2b91e9ca63635d5d74e0ab67401c0143e",
]

# The inference-auth controlled-probe test uses a fixed discriminator with a
# 32-character lowercase-hex suffix so the trusted bypass path is exercised
# without accepting a production credential. Scope both the file and exact
# synthetic value shape so every other token in the test remains scanned.
[[allowlists]]
description = "Inference-auth controlled-probe unit-test discriminator"
condition = "AND"
paths = [
  '''(^|/)packages/cloud/shared/src/lib/services/inference-auth-context\.test\.ts$''',
]
regexTarget = "line"
regexes = [
  '''unit-probe-token:[0-9a-f]{32}''',
]

# Mobile app authorization identifies the public client with a UUID in the
# checked-in Worker configuration. The identifier selects an OAuth client but
# cannot authenticate as it; credentials remain secret bindings. Scope the
# exception to the exact field and UUID shape so every neighboring value and
# every secret-shaped mobile auth setting stays scanned.
[[allowlists]]
description = "Public mobile app authorization client identifier"
condition = "AND"
paths = [
  '''(^|/)packages/cloud/api/wrangler\.toml$''',
]
regexTarget = "line"
regexes = [
  '''ELIZA_MOBILE_APP_AUTH_APP_ID\s*=\s*"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"''',
]

# The resource-capacity action-effect tests pin a literal proposal
# idempotency key so replay assertions are readable; the fixed fixture name
# crosses the generic-api-key entropy threshold. Scope the exact literal to
# the one test file so every other token in it stays scanned.
[[allowlists]]
description = "Resource-capacity proposal test fixture idempotency key (synthetic literal)"
condition = "AND"
paths = [
  '''(^|/)plugins/plugin-personal-assistant/src/lifeops/action-effect-result\.test\.ts$''',
]
regexTarget = "line"
regexes = [
  '''capacity-proposal-key-1''',
]

# This deterministic runtime redaction test supplies an invented credential to
# prove configured secrets are removed from output. Match only that literal in
# that test; other credentials in the same file must still fail the scan.
[[allowlists]]
description = "Runtime configured-secret redaction synthetic credential fixture"
condition = "AND"
paths = [
  '''(^|/)packages/core/src/__tests__/runtime-redaction-configured-secrets\.test\.ts$''',
]
regexTarget = "secret"
regexes = [
  '''^sk-live-abcdef1234567890abcdef$''',
]

# Chrome derives an unpacked extension's stable ID from this public RSA
# verification key. It is intentionally shipped in the manifest and cannot
# authenticate or sign an extension; the corresponding private signing key is
# never stored in this repository. Scope the exception to the named field in
# the one identity file so every other value remains scanned.
[[allowlists]]
description = "Browser bridge public Chrome development manifest identity key"
condition = "AND"
paths = [
  '''(^|/)packages/browser-bridge-extension/identity\.json$''',
]
regexTarget = "line"
regexes = [
  '''"chrome(Dev)?ManifestKey"\s*:\s*"MIIB[A-Za-z0-9+/=]+"''',
]

# Token-info uses the public USDC mainnet contract address as a deterministic
# lookup key for a mocked DexScreener response. The generic-api-key rule keys on
# the TOKEN_ADDRESS identifier even though Ethereum contract addresses are
# public routing identifiers, not credentials. Match the exact public address
# in the one keyless scenario so every other value remains scanned.
[[allowlists]]
description = "Wallet token-info scenario public USDC contract address"
condition = "AND"
paths = [
  '''(^|/)plugins/plugin-wallet/test/scenarios/token-info\.scenario\.ts$''',
]
regexTarget = "line"
regexes = [
  '''TOKEN_ADDRESS\s*=\s*"0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"''',
]

# The deterministic scenario scripts explicitly clear every Cerebras key. In
# the historical command text, adjacent empty shell assignments make the
# generic-api-key rule misread the next variable name as a value. Scope the
# exact all-empty assignment sequence to the scenario-runner manifest; any
# non-empty key or different command still fails the scan.
[[allowlists]]
description = "Scenario-runner deterministic lanes clear Cerebras credentials"
condition = "AND"
paths = [
  '''(^|/)packages/scenario-runner/package\.json$''',
]
regexTarget = "line"
regexes = [
  '''CEREBRAS_API_KEY= EVAL_CEREBRAS_API_KEY= ELIZA_E2E_CEREBRAS_API_KEY=''',
]

[[allowlists]]
description = "Headscale DEPLOY.md CLI examples (`headscale apikeys create` — not a credential)"
paths = [
  '''(^|/)packages/cloud/services/headscale/DEPLOY\.md$''',
]

[[allowlists]]
description = "Documented placeholder strings"
regexTarget = "match"
regexes = [
  '''example\.com''',
  '''0x0000000000000000000000000000000000000000''',
  '''sk-XXXX''',
  '''sk-test_''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  # `Authorization: Bearer YOUR_API_KEY` placeholders in documented curl
  # examples (affiliates monetization page, API route explorer, etc.). The
  # curl-auth-header rule flags the literal placeholder token; it is the
  # documentation stand-in, never a real key (a real key would be a different
  # match and would not contain this literal).
  '''YOUR_API_KEY''',
  '''YOUR_CODE_HERE''',
]

[[allowlists]]
description = "PEM envelope template wrappers (no key material checked in)"
paths = [
  '''(^|/)packages/cloud/shared/src/lib/auth/agent-token\.ts$''',
]
regexTarget = "match"
regexes = [
  '''-----BEGIN PRIVATE KEY-----''',
  '''-----END PRIVATE KEY-----''',
]

[[allowlists]]
description = "Generated lockfiles — hash output, not secrets"
paths = [
  '''(^|/)bun\.lock$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)poetry\.lock$''',
  '''(^|/)uv\.lock$''',
]

# Vendored third-party dependency patches (Bun/npm `patches/` overlays). These
# are upstream package diffs that embed base64/hex blobs (compiled artifacts,
# native binaries) whose high-entropy lines trip generic token rules — e.g. the
# llama-cpp-capacitor patch matched `sourcegraph-access-token`. They are not our
# credentials. Scoped to `patches/` directories so real source is still scanned.
[[allowlists]]
description = "Vendored dependency patch overlays — upstream blobs, not secrets"
paths = [
  '''(^|/)patches/[^/]+\.patch$''',
]

# evidence/tee/*.json: keyMaterialSha256 fields are SHA-256 digests of TEE key
# material captured for attestation evidence — the hashes themselves are not
# secrets, and publishing them is the entire point of the evidence artifact.
[[allowlists]]
description = "TEE attestation evidence: SHA-256 of key material, not the key"
paths = [
  '''(^|/)evidence/tee/.*\.json$''',
]
regexTarget = "match"
regexes = [
  '''"keyMaterialSha256"\s*:\s*"[0-9a-fA-F]{64}"''',
]

# Anvil / Hardhat well-known deterministic dev account #0 private key. Public,
# documented, used by every Ethereum dev tool's local node. Lives in an e2e
# helper that injects a fake wallet for Playwright tests.
[[allowlists]]
description = "Anvil/Hardhat well-known test private key (public dev fixture)"
paths = [
  '''(^|/)packages/cloud-frontend/tests/e2e/_helpers/injected-eth\.ts$''',
]
regexTarget = "match"
regexes = [
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
]

# cloud-frontend ships generated `llms.txt` / `llms-full.txt` under its static
# `public/` dir (and `.well-known/` mirrors) — a concatenated dump of the public
# product docs for LLM ingestion. They embed token-like strings from documented
# API-key shapes and sample IDs but are generated, publicly served content with
# no real credentials. Scoped to those exact generated files.
[[allowlists]]
description = "cloud-frontend generated LLM docs dumps (public generated content)"
paths = [
  '''(^|/)packages/cloud-frontend/public/(\.well-known/)*llms(-full)?\.txt$''',
]

# eliza-1 smoke SFT corpus (~400 rows) is INTENTIONALLY tracked (see the
# `!data/final-eliza1-smoke/**` re-includes in packages/training/.gitignore) so the
# e2e SFT pipeline can be smoke-tested from a fresh clone. Its synthetic/captured
# conversation rows carry tokens that trip generic-api-key: a documentation-style
# `api_key: sk_live_abc123xyz` placeholder and a captured Daytona/Node sandbox env
# dump whose `GPG_KEY=<40-hex>` is the official `node` base image's PUBLIC signing-key
# fingerprint (plus non-secret DAYTONA_SANDBOX_* ids). No real credentials. Needed
# because gitleaks scans the add in commit d28c72036d's range.
[[allowlists]]
description = "eliza-1 smoke SFT corpus (synthetic/captured-public tokens, not credentials)"
paths = [
  '''(^|/)packages/training/data/final-eliza1-smoke/.*\.jsonl$''',
]

# eliza-1 smoke SFT corpus (final-eliza1-smoke/*.jsonl): a ~400-row e2e pipeline
# validator DELIBERATELY kept in git (see packages/training/.gitignore negations)
# so the SFT pipeline can be smoke-tested from a fresh clone. Its synthetic
# training rows include captured Daytona/Node sandbox env dumps — GPG_KEY is the
# Node base image's PUBLIC release-key fingerprint, DAYTONA_SANDBOX_* are ids —
# and dummy api-key examples (sk_live_abc123xyz). Generated content, not
# credentials. Scoped to the corpus jsonl only.
[[allowlists]]
description = "eliza-1 smoke SFT corpus (synthetic training rows, not credentials)"
paths = [
  '''(^|/)packages/training/data/final-eliza1-smoke/.*\.jsonl$''',
]

# plugin-discord/group-coordination.ts: DISCORD_SPEAKER_LEASE_TABLE's value is
# the literal Postgres table name "discord_coordination_reply_slots" — which is
# coincidentally the exact shape the `discord-client-secret` rule looks for (the
# word "discord" followed by a 32-char lowercase/underscore token). The same
# identifier appears verbatim in the plugin migration and in its CREATE TABLE
# statements, so it is a schema name, not a credential. Match the full
# assignment rather than allowlisting the path, so every other token in that
# file — including a genuine DISCORD_CLIENT_SECRET — remains scanned.
[[allowlists]]
description = "Discord coordination table-name constant (schema identifier, not a credential)"
regexTarget = "match"
regexes = [
  '''DISCORD_SPEAKER_LEASE_TABLE\s*=\s*"discord_coordination_reply_slots"''',
]

# Discord readiness diagnostics use a human-readable error key, not a client
# credential. Two additive commits carried spellings that matched the
# discord-client-secret heuristic; allow only those exact historical commits so
# current and future Discord source remains fully scanned.
[[allowlists]]
description = "Discord interaction-readiness diagnostic key (not a credential)"
commits = [
  "84076db8c101861e1010781abc569ff571639791",
  "c118ecb29ce8b66518e57092e0426cdf52bd5045",
]

# The vast run-certification test drives its offer/create/destroy flow with an
# obviously fake fixture credential ("vast-key-hunter3"). The generic-api-key
# rule keys on the apiKey field name regardless of value. Match the exact
# fixture string in the one test file so any real-looking value still fails.
[[allowlists]]
description = "vast run-certification test fixture credential"
condition = "AND"
paths = [
  '''(^|/)scripts/vast/run-certification\.test\.mjs$''',
]
regexTarget = "line"
regexes = [
  '''apiKey:\s*"vast-key-hunter3"''',
]

# Billing tests use fixed, non-provider fixture sentinels to select controlled
# Stripe transports. Keep historical additions scannable while allowing only
# these exact assignments in the owning tests; other credentials still fail.
[[allowlists]]
description = "Subscription billing controlled-transport fixture sentinels"
condition = "AND"
paths = [
  '''(^|/)packages/cloud/shared/src/db/repositories/stripe\-terminal\-consumer\.pglite\.test\.ts$''',
  '''(^|/)packages/cloud/shared/src/db/repositories/subscription\-cancellation\-consumer\.pglite\.test\.ts$''',
  '''(^|/)packages/cloud/shared/src/db/repositories/subscription\-cancellation\-event\.pglite\.test\.ts$''',
  '''(^|/)packages/cloud/shared/src/db/repositories/subscription\-notices\.pglite\.test\.ts$''',
  '''(^|/)packages/cloud/shared/src/db/repositories/subscription\-renewal\-schedule\-lineage\.pglite\.test\.ts$''',
  '''(^|/)packages/cloud/shared/src/db/repositories/subscription\-renewal\.pglite\.test\.ts$''',
  '''(^|/)packages/cloud/shared/src/lib/services/subscription\-catalog\-cloud\-e2e\.test\.ts$''',
]
regexTarget = "line"
regexes = [
  '''^\s*(?:process\.env\.STRIPE_SECRET_KEY\s*=\s*|STRIPE_SECRET_KEY:\s*)"(?:sk_test_cancellationfixture|sk_test_renewalfixture|sk_test_terminalfixture|sk_test_validfixture)"[;,]?\s*$''',
]
