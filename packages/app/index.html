<!doctype html>

<head>
  <!-- Polyfill for three.js TSL WebGPU enum access.
       Three.js assumes self.GPUShaderStage exists when self is defined,
       but many browsers have self without WebGPU support. -->
  <script>
    if (typeof self !== 'undefined' && !self.GPUShaderStage) {
      self.GPUShaderStage = Object.freeze({ VERTEX: 1, FRAGMENT: 2, COMPUTE: 4 });
    }
    if (typeof self !== 'undefined' && !self.GPUBufferUsage) {
      self.GPUBufferUsage = Object.freeze({
        MAP_READ: 1, MAP_WRITE: 2, COPY_SRC: 4, COPY_DST: 8,
        INDEX: 16, VERTEX: 32, UNIFORM: 64, STORAGE: 128,
        INDIRECT: 256, QUERY_RESOLVE: 512
      });
    }
    if (typeof self !== 'undefined' && !self.GPUTextureUsage) {
      self.GPUTextureUsage = Object.freeze({
        COPY_SRC: 1, COPY_DST: 2, TEXTURE_BINDING: 4,
        STORAGE_BINDING: 8, RENDER_ATTACHMENT: 16
      });
    }
    if (typeof self !== 'undefined' && !self.GPUColorWrite) {
      self.GPUColorWrite = Object.freeze({
        RED: 1, GREEN: 2, BLUE: 4, ALPHA: 8, ALL: 15
      });
    }
    if (typeof self !== 'undefined' && !self.GPUMapMode) {
      self.GPUMapMode = Object.freeze({ READ: 1, WRITE: 2 });
    }
  </script>
  <!-- ELIZA_NATIVE_AGENT_IPC_BRIDGE_START -->
  <script>
    (() => {
      if (typeof window === 'undefined' || typeof window.fetch !== 'function') return;
      if (window.__ELIZA_ANDROID_IPC_FETCH_BRIDGE__) return;

      const originalFetch = window.fetch.bind(window);
      const ipcProtocol = 'eliza-local-agent:';
      const ipcHost = 'ipc';
      const ipcBase = 'eliza-local-agent://ipc';
      const ipcPathPrefix = `//${ipcHost}`;
      const localAgentPort = '31337';
      const mobileRuntimeModeStorageKey = 'eliza:mobile-runtime-mode';

      // The loopback (127.0.0.1:31337) → native-IPC rewrite below is only
      // correct on a NATIVE Capacitor platform (iOS/Android), where the
      // in-process local agent has no directly-reachable TCP port and
      // `Agent.request` resolves to a NATIVE plugin. On any non-native host
      // (Electrobun desktop, plain web) there is no native Agent plugin, so
      // `Agent.request` falls back to the web implementation, which fetches
      // `${apiBase}${path}` — the same loopback URL — and re-enters this bridge,
      // recursing forever (renderer OOM). Gate the rewrite on a positive
      // native-platform check so loopback fetches hit the real server directly
      // everywhere else. Capacitor sets window.Capacitor on every platform and
      // this runs at fetch time (after modules load), so the check is reliable.
      function isNativeCapacitorAgentHost() {
        try {
          const cap = window.Capacitor;
          if (!cap || typeof cap.getPlatform !== 'function') return false;
          const p = cap.getPlatform();
          return p === 'ios' || p === 'android';
        } catch (_) {
          return false;
        }
      }

      function nativeModeUsesOnDeviceAgent() {
        try {
          const mode = window.localStorage.getItem(mobileRuntimeModeStorageKey);
          if (mode === 'remote-mac' || mode === 'cloud') {
            return false;
          }
          return true;
        } catch (_) {
          // error-policy:J4 storage unavailable — preserve native-local compatibility.
          return true;
        }
      }

      function rawUrl(input) {
        try {
          return input && typeof input === 'object' && 'url' in input ? input.url : String(input);
        } catch (_) {
          return null;
        }
      }

      function ipcPath(raw) {
        if (!raw) return null;
        const trimmed = String(raw).trim();
        if (!trimmed) return null;
        const lower = trimmed.toLowerCase();
        if (lower === ipcBase) return '/';
        if (lower.indexOf(`${ipcBase}/`) === 0 || lower.indexOf(`${ipcBase}?`) === 0) {
          const suffix = trimmed.slice(ipcBase.length);
          return suffix.charAt(0) === '?' ? `/${suffix}` : suffix || '/';
        }
        try {
          const url = new URL(trimmed, window.location?.href ? window.location.href : 'https://cloud.eliza.app');
          if (
            isNativeCapacitorAgentHost() &&
            nativeModeUsesOnDeviceAgent() &&
            url.protocol === 'http:' &&
            url.port === localAgentPort &&
            (url.hostname === '127.0.0.1' || url.hostname === 'localhost' || url.hostname === '[::1]' || url.hostname === '::1')
          ) {
            return (url.pathname || '/') + url.search;
          }
          if (url.protocol !== ipcProtocol) return null;
          if (url.hostname === ipcHost) return (url.pathname || '/') + url.search;
          if (url.pathname === ipcPathPrefix) return url.search ? `/${url.search}` : '/';
          if (url.pathname.indexOf(`${ipcPathPrefix}/`) === 0) {
            return url.pathname.slice(ipcPathPrefix.length) + url.search;
          }
        } catch (_) {
          return null;
        }
        return null;
      }

      function methodAllowsBody(method) {
        const normalized = String(method || 'GET').toUpperCase();
        return normalized !== 'GET' && normalized !== 'HEAD';
      }

      function headersToRecord(headers) {
        const record = {};
        if (!headers) return record;
        new Headers(headers).forEach((value, key) => {
          record[key] = value;
        });
        return record;
      }

      function unavailable(message) {
        return new Response(JSON.stringify({
          error: 'native_agent_unavailable',
          message: message
        }), {
          status: 503,
          statusText: 'Service Unavailable',
          headers: { 'content-type': 'application/json' }
        });
      }

      function bodyToString(body) {
        if (body === null) return null;
        if (body === undefined) return undefined;
        if (typeof body === 'string') return body;
        if (body instanceof URLSearchParams) return body.toString();
        return undefined;
      }

      async function normalizeInit(input, init) {
        const request = input instanceof Request ? input.clone() : null;
        const method = String(init?.method || request?.method || 'GET').toUpperCase();
        const headers = init?.headers || request?.headers;
        if (!methodAllowsBody(method)) {
          return { method: method, headers: headers };
        }
        if (init && 'body' in init) {
          const explicitBody = bodyToString(init.body);
          if (explicitBody === undefined && init.body != null) return null;
          return { method: method, headers: headers, body: explicitBody || undefined };
        }
        if (!request) return { method: method, headers: headers };
        const requestBody = await request.text();
        return { method: method, headers: headers, body: requestBody || undefined };
      }

      function resolveAgentPlugin() {
        try {
          const cap = window.Capacitor;
          if (!cap) return null;
          const plugins = cap.Plugins || {};
          return plugins.Agent || (typeof cap.registerPlugin === 'function' ? cap.registerPlugin('Agent') : null);
        } catch (_) {
          return null;
        }
      }

      window.fetch = async function elizaAndroidIpcFetchBridge(input, init) {
        const raw = rawUrl(input);
        const path = ipcPath(raw);
        if (path === null) return originalFetch(input, init);

        const normalized = await normalizeInit(input, init);
        if (!normalized) {
          return unavailable('Android local-agent IPC only supports string request bodies');
        }

        const agent = resolveAgentPlugin();
        if (!agent || typeof agent.request !== 'function') {
          return unavailable('Android local-agent IPC is unavailable because the native Agent plugin is not registered');
        }

        const result = await agent.request({
          method: normalized.method,
          path: path,
          headers: headersToRecord(normalized.headers),
          body: methodAllowsBody(normalized.method) ? (normalized.body || null) : null
        });
        // Prefer the lossless base64 of the raw response bytes so binary
        // payloads (e.g. local TTS WAV audio) survive intact; `body` is only a
        // best-effort UTF-8 view that mangles non-text bytes.
        let responseBody = result?.body ? result.body : '';
        if (result && typeof result.bodyBase64 === 'string' && result.bodyBase64.length > 0) {
          const binary = atob(result.bodyBase64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          responseBody = bytes;
        }
        return new Response(responseBody, {
          status: result?.status ? result.status : 200,
          statusText: result?.statusText ? result.statusText : '',
          headers: result?.headers ? result.headers : undefined
        });
      };

      window.__ELIZA_ANDROID_IPC_FETCH_BRIDGE__ = true;
    })();
  </script>
  <!-- ELIZA_NATIVE_AGENT_IPC_BRIDGE_END -->

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!--
    CSP hardening notes (W1-053):
    - `object-src 'none'`, `base-uri 'none'`, `form-action 'self'`, and
      `manifest-src 'self'` are hard backstops: the app renders no
      <object>/<embed>/<base> tags and submits no cross-origin native forms.
    - `script-src` carries `blob:` so authenticated remote view bundles fetched
      by the API client can execute from short-lived module URLs. This permits
      execution, not fetching, and remains a deliberate hardening boundary. It
      still carries 'unsafe-inline' for the inline bootstrap
      scripts in this file (WebGPU polyfill, Android IPC fetch bridge,
      marketing launch surface) and 'unsafe-eval'/'wasm-unsafe-eval' for
      runtime-evaluating dependencies. Dropping 'unsafe-inline' means moving
      those bootstraps to external files or build-time CSP hashes — tracked as
      follow-up, not safe to do blind.
    - Session tokens (steward_session_token et al.) live in localStorage by
      SPA bearer-token design; any script-injection sink therefore reaches
      them. Output-encoding guards at each sink are the mitigation; this CSP
      is the backstop, not the boundary.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' electrobun://* https://*__APP_CSP_LOCAL_HTTP__;
               script-src 'self' blob: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://*__APP_CSP_LOCAL_HTTP__;
               style-src 'self' 'unsafe-inline' https://*__APP_CSP_LOCAL_HTTP__;
               connect-src 'self' blob: data: eliza-local-agent: https://* wss://*__APP_CSP_LOCAL_CONNECT__;
               img-src 'self' data: blob: https://*__APP_CSP_LOCAL_HTTP__;
               media-src 'self' blob: https://*__APP_CSP_LOCAL_HTTP__;
               frame-src 'self' https://*__APP_CSP_LOCAL_HTTP__;
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'none';
               form-action 'self';
               manifest-src 'self';
               font-src 'self' data: https://*__APP_CSP_LOCAL_HTTP__;" />
  <title>__APP_NAME__</title>
  <meta name="description" content="__APP_DESCRIPTION__" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="__APP_URL__" />
  <meta property="og:title" content="__APP_NAME__" />
  <meta property="og:description" content="__APP_DESCRIPTION__" />
  <meta property="og:image" content="__APP_SHARE_IMAGE__" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="__APP_URL__" />
  <meta property="twitter:title" content="__APP_NAME__" />
  <meta property="twitter:description" content="__APP_DESCRIPTION__" />
  <meta property="twitter:image" content="__APP_SHARE_IMAGE__" />

  <link rel="icon" type="image/svg+xml" href="/brand/favicons/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/brand/favicons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <script>
    // One bundle serves both the dark agent app and the light public marketing
    // pages. Seed the marketing launch surface before the inline FOUC CSS is
    // parsed so #root cannot paint the app's black fallback while the public
    // renderer and its lazy landing-page chunk are still downloading.
    (() => {
      const marketingHostnames = [
        "eliza.app",
        "www.eliza.app",
        "staging.eliza.app",
        "elizacloud.ai",
        "www.elizacloud.ai",
        "dev.elizacloud.ai",
        "staging.elizacloud.ai",
        "b.eliza.app",
        "eliza-app-b.pages.dev",
      ];
      const hostname = (location.hostname || "").toLowerCase().replace(/\.$/, "");
      if (marketingHostnames.indexOf(hostname) === -1) return;

      const root = document.documentElement;
      root.setAttribute("data-public-marketing", "true");
      root.style.setProperty("--launch-bg", "#fdfaf7");
      root.style.setProperty("--launch-foreground", "#000000");
      root.style.colorScheme = "light";

      const themeColor = document.querySelector('meta[name="theme-color"]');
      const colorScheme = document.querySelector('meta[name="color-scheme"]');
      if (themeColor) themeColor.setAttribute("content", "#fdfaf7");
      if (colorScheme) colorScheme.setAttribute("content", "light");

      // These are the only above-the-fold image requests in the desktop
      // static hero. Start them from the HTML parse instead of waiting for
      // the entry -> public shell -> landing-page module chain. Skip every
      // other public route (including signed-out /login): those surfaces do
      // not render these marks, so a host-wide preload becomes an unused
      // high-priority fetch.
      const pathname = (location.pathname || "/").replace(/\/+$/, "") || "/";
      if (pathname === "/" && window.matchMedia("(min-width: 641px)").matches) {
        for (const href of [
          "/brand/logos/logo_white_orangebg.svg",
          "/brand/logos/eliza_text_black.svg",
        ]) {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = href;
          preload.setAttribute("fetchpriority", "high");
          document.head.appendChild(preload);
        }
      }
    })();
  </script>
  <script>
    // The agent app has one curated dark appearance. Public marketing was
    // classified above and keeps its light launch surface through first paint.
    (() => {
      try {
        const root = document.documentElement;
        if (root.getAttribute('data-public-marketing') === 'true') {
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
          return;
        }
        root.classList.add('dark');
        root.style.colorScheme = 'dark';
        root.setAttribute('data-theme', 'dark');
      } catch {}
    })();
  </script>
  <script>
    // Classify native desktop-only surfaces before the FOUC guard below. The
    // detached assistant is transparent; managed Workspace/Settings windows
    // use a quiet charcoal canvas. Neither should flash the full-app black
    // branded preboot shell while its renderer bundle loads.
    (() => {
      const params = new URLSearchParams(window.location.search);
      const shellMode = params.get("shellMode") || params.get("shell-mode");
      const root = document.documentElement;
      if (shellMode === "chat-overlay") {
        root.setAttribute("data-chat-overlay-preboot", "true");
        root.style.setProperty("--launch-bg", "transparent");
        return;
      }
      const desktopSurface = params.get("desktopSurface");
      if (desktopSurface === "workspace" || desktopSurface === "settings") {
        root.setAttribute("data-desktop-managed-preboot", "true");
        root.style.setProperty("--launch-bg", "#181a20");
        root.style.setProperty("--launch-foreground", "#f4f5f7");
      }
    })();
  </script>
  <style>
    /* FOUC guard — runs before external CSS so we use concrete values.
       The launch surface is black (#000000 — DEFAULT_BACKGROUND_COLOR, the
       base field of the home ShaderBackground; the orange ember glow renders
       on top of it). Keep it separate from --bg: --bg
       resolves to the light/dark theme background and can flash white/black
       before the loader appears. This surface PERSISTS as the page background
       under the app: any strip the fixed background layers don't reach (the
       iOS home-indicator safe-area under the composer, overscroll zones)
       shows this color, so it must EQUAL the default home background — that
       equality (enforced by test/brand-surface.test.ts) is what makes any
       bleed-through invisible. */
    :root {
      --launch-bg: #000000;
      --launch-foreground: #fdfaf7;
    }

    html,
    body,
    #root {
      background-color: var(--launch-bg, #000000);
    }

    html[data-chat-overlay-preboot="true"],
    html[data-chat-overlay-preboot="true"] body,
    html[data-chat-overlay-preboot="true"] #root {
      background: transparent;
      background-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      color: var(--launch-foreground, #fdfaf7);
      font-family: var(--font-sans, "Poppins", Arial, system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* The body remains full-bleed. Routed surfaces consume the shared safe-area
       variables at their own interactive edges; applying the inset here as well
       would shift every surface a second time once a native WebView resolves
       env(safe-area-inset-*). */

    #root {
      min-height: 100dvh;
      background-color: var(--launch-bg, #000000);
    }

    /* The shell lives OUTSIDE the React mount root as a fixed overlay: React
       mounting must not wipe it, because with a lazy router shell the first
       commits render empty Suspense fallbacks into #root — the measured
       ~1.4s blank on the hosted /login route (#18256). An inline observer below
       removes it once #root paints meaningful content. */
    .eliza-preboot-shell {
      position: fixed;
      inset: 0;
      z-index: 9999;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--launch-bg, #000000);
      color: var(--launch-foreground, #fdfaf7);
    }

    /* Managed native windows and the detached assistant paint only their final
       launch surfaces until React is ready. Hide the branded shell in CSS as
       well as removing it below so no parser/first-frame timing can expose the
       logo or loading copy. */
    html[data-desktop-managed-preboot="true"] .eliza-preboot-shell,
    html[data-chat-overlay-preboot="true"] .eliza-preboot-shell {
      display: none;
    }

    .eliza-preboot-shell__content {
      display: flex;
      width: 100%;
      max-width: 384px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 24px;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    .eliza-preboot-shell__brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .eliza-preboot-shell__mark {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .eliza-preboot-shell__lockup {
      width: min(17rem, 78vw);
      height: auto;
      object-fit: contain;
    }

    .eliza-preboot-shell__name {
      font-size: 36px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
    }

    .eliza-preboot-shell__status {
      margin: 0;
      min-height: 20px;
      font-size: 14px;
      line-height: 20px;
      opacity: 0.8;
      animation: eliza-preboot-status-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes eliza-preboot-status-pulse {
      50% {
        opacity: 0.5;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .eliza-preboot-shell__status {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="eliza-preboot-shell" class="eliza-preboot-shell" role="status" aria-live="polite" aria-label="Loading elizaOS">
    <div class="eliza-preboot-shell__content">
      <div class="eliza-preboot-shell__brand" aria-hidden="true">
        <img class="eliza-preboot-shell__mark" src="%BASE_URL%brand/logos/logo_white_nobg.svg" alt="" />
        <span class="eliza-preboot-shell__name">elizaOS</span>
      </div>
      <p class="eliza-preboot-shell__status">Booting up&hellip;</p>
    </div>
  </div>
  <script>
    // Remove the preboot shell only when #root paints MEANINGFUL content.
    // React's first commits under the lazy web router shell render empty
    // aria-busy Suspense fallbacks (#18256's ~1.4s blank once the old
    // in-#root shell was wiped at mount); text or a media/control element is
    // the signal the app has really painted. MutationObserver callbacks run
    // before the next frame, so the swap is never visible as an overlay
    // covering live UI. If boot never paints (script/network death) the
    // branded shell intentionally stays, exactly like the old in-root shell.
    (() => {
      const shell = document.getElementById("eliza-preboot-shell");
      const root = document.getElementById("root");
      if (!shell) return;
      // The overlay's host is transparent from the first style calculation.
      // Remove the full-app brand lockup synchronously; ChatOverlay owns the
      // only visible loading/ready surface in this specialized window.
      if (document.documentElement.getAttribute("data-chat-overlay-preboot") === "true") {
        shell.remove();
        return;
      }
      // Managed native Workspace/Settings windows use the neutral launch canvas
      // until their real shell paints; they never show branded loading chrome.
      if (document.documentElement.getAttribute("data-desktop-managed-preboot") === "true") {
        shell.remove();
        return;
      }
      // The head classified public marketing before any CSS could paint. Drop
      // the agent-branded boot shell synchronously and leave the already-white
      // root visible until the static hero commits.
      if (document.documentElement.getAttribute("data-public-marketing") === "true") {
        shell.remove();
        return;
      }
      if (!root || typeof MutationObserver !== "function") return;
      const hasMeaningfulContent = () =>
        (root.textContent || "").trim().length > 0 ||
        root.querySelector("img,svg,canvas,video,iframe,input,button,textarea,select") !== null;
      const observer = new MutationObserver(() => {
        if (!hasMeaningfulContent()) return;
        observer.disconnect();
        shell.remove();
      });
      observer.observe(root, { childList: true, subtree: true, characterData: true });
      if (hasMeaningfulContent()) {
        observer.disconnect();
        shell.remove();
      }
    })();
  </script>
  <!-- Node polyfills — inline sync script ensures they're available before any ESM module evaluates -->
  <script>
    if (typeof globalThis.process === "undefined") {
      globalThis.process = {
        env: { NODE_ENV: "development" },
        cwd: () => "/",
        platform: "browser",
        version: "v0.0.0",
        versions: {},
        nextTick: (cb) => { Promise.resolve().then(cb); },
        stdout: { write: () => {} },
        stderr: { write: () => {} },
        argv: [],
        pid: 0,
        exit: () => {},
        on: function() { return this; },
        off: function() { return this; },
        emit: () => {},
        browser: true,
      };
    }
    if (typeof globalThis.Buffer === "undefined") {
      globalThis.Buffer = {
        alloc: (n) => new Uint8Array(n),
        from: (a, enc) => {
          if (typeof a === "string") {
            if (enc === "base64") {
              const b = atob(a);
              const u = new Uint8Array(b.length);
              for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
              return u;
            }
            return new TextEncoder().encode(a);
          }
          return new Uint8Array(a);
        },
        isBuffer: () => false,
        concat: (bufs) => {
          const total = bufs.reduce((s, b) => s + b.length, 0);
          const result = new Uint8Array(total);
          let offset = 0;
          bufs.forEach((b) => { result.set(b, offset); offset += b.length; });
          return result;
        },
        byteLength: (s) => new TextEncoder().encode(s).length,
      };
    }
  </script>
  <script type="module" src="/src/entry.ts"></script>
</body>

</html>
