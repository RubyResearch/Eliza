# This reusable workflow is the current develop validation graph. Pull requests
# use pr-static-smoke.yml; a subsequent trigger-authority slice will call this
# graph and the other validation families from one Develop Full entry point.
name: CI

on:
  workflow_call:
  workflow_dispatch:

# A newer develop tip invalidates read-only verification of an older tip. Manual
# diagnostics retain a run-scoped group and never collide with branch health.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  changes:
    name: Classify changes
    uses: ./.github/workflows/classify-paths.yml
    with:
      config: test
      run_windows_contract: true
      # ci.yml was unconditionally hosted before consolidation — keep it
      # hosted for ALL events (push, workflow_call, dispatch) to preserve the
      # SPOF guard (#13617): a drained self-hosted fleet must never leave the
      # merge-gate classifier queued.
      force_hosted: true

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      # A mid-merge tree can carry literal conflict markers into otherwise
      # buildable source — auth-critical UI files once shipped this way.
      # Fail in seconds, before install/build spend, when any tracked file
      # starts a line with the <<<<<<< or >>>>>>> marker.
      - name: Reject unresolved merge-conflict markers
        run: |
          set -euo pipefail
          status=0
          git grep -n -E '^(<{7}|>{7})( |$)' -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Unresolved git merge-conflict marker(s) in the tracked files listed above. Finish or abort the merge before landing."
            exit 1
          elif [ "$status" -gt 1 ]; then
            echo "::error::merge-conflict marker scan failed (git grep exit $status)"
            exit 1
          fi
          echo "No unresolved merge-conflict markers in tracked files."

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # build:core runs first so package typechecks resolve workspace dist
      # output instead of each racing to rebuild it inside the verify fan-out.
      - name: Build core contract
        run: bun run build:core

      # RUN_TURBO_CONCURRENCY=4: hosted runners have 4 vCPUs and ~16 GB; the
      # package-script default of 8 concurrent tsc processes on a full
      # workspace cone OOM-kills the runner VM (exit 143, #15140).
      - name: Repository verification
        env:
          RUN_TURBO_CONCURRENCY: "4"
        run: bun run verify

      - name: Formatting
        run: bun run format:check

  # The unit-test lanes were four steps on one runner, so their durations added
  # up: 22.4 + 18.3 + 28.4 min on run 31504110080, a 71.8-minute job that set
  # the whole run's wall clock. They share no state and each already had its own
  # path gate, so they are four jobs and the run waits for the longest, not the
  # sum.
  #
  # Each job is unconditional and gates its own steps instead of carrying a
  # job-level `if:`. A skipped job reports `skipped`, which `required` treats as
  # failure by design; gating the steps keeps every lane reporting `success`
  # while an unaffected lane costs only its checkout.
  tests:
    name: Tests (scripts)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Build core contract for script tests
        run: bun run build:core

      - name: Script contract tests
        env:
          E2E_COVERAGE_GATE_ENFORCE: "1"
        run: bun run test:scripts

  tests_server:
    name: Tests (server, ${{ matrix.partition }})
    needs: changes
    runs-on: ubuntu-24.04
    # Agent's process-isolated suite must not compete with the core and app
    # runtime suites on the same small hosted runner.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: agent
            filter: '^@elizaos/agent \(packages/agent\)#test$'
          - partition: remaining
            filter: '^(?!@elizaos/agent \(packages/agent\)#test$)'
    env:
      TEST_PACKAGE_FILTER: ${{ matrix.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        if: needs.changes.outputs.server == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Server tests
        if: needs.changes.outputs.server == 'true'
        run: bun run test:server

      - name: No affected server lane
        if: needs.changes.outputs.server != 'true'
        run: echo "No server test lane is affected."

  tests_client:
    name: Tests (client)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        if: needs.changes.outputs.client == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install browser for client integration tests
        if: needs.changes.outputs.client == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Client tests
        if: needs.changes.outputs.client == 'true'
        run: bun run test:client

      - name: No affected client lane
        if: needs.changes.outputs.client != 'true'
        run: echo "No client test lane is affected."

  tests_plugins:
    name: Tests (plugins)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        if: needs.changes.outputs.plugins == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Plugin tests
        if: needs.changes.outputs.plugins == 'true'
        run: bun run test:plugins

      - name: No affected plugin lane
        if: needs.changes.outputs.plugins != 'true'
        run: echo "No plugin test lane is affected."

  smoke:
    name: Smoke
    needs: changes
    runs-on: ubuntu-24.04
    # 725 Playwright tests that the suite's one-live-stack-per-process
    # invariant pins to a single worker. Measured on run 31489483093: six
    # shards land between 22.8 and 34.4 minutes of test time against ~96 on one
    # machine. The spread is Playwright balancing by test count rather than
    # duration, and roughly 13 minutes per shard is fixed setup that does not
    # divide -- which is why more shards stop paying past this point.
    timeout-minutes: 60
    strategy:
      # One shard's product failure must not hide the other five: a shard that
      # cancels its siblings reports a partial suite as the lane's verdict.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        if: needs.changes.outputs.zero_key == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # The zero-key e2e suite drives chromium (desktop + mobile projects) and
      # webkit; without this the whole lane fails at browserType.launch.
      - name: Install Playwright browsers
        if: needs.changes.outputs.zero_key == 'true'
        run: PLAYWRIGHT_INSTALL_CWD=packages/app .github/scripts/install-playwright-browsers.sh chromium webkit

      # Playwright is the only shardable task in the e2e lane; its other 16
      # tasks run once in `smoke_lanes`. Measured on run 31504110080, replaying
      # them here cost 8.6 min on EVERY shard -- plugin-personal-assistant alone
      # is 5.8 -- for about 52 min of duplicate runner time per lane.
      #
      # Invoked directly rather than through run-all-tests: that orchestrator's
      # --require-work guard certifies work from reconciled JUnit reports, and
      # Playwright produces none. With the vitest tasks filtered away it has
      # nothing left to observe and exits 3 on a suite that passed (run
      # 31512602909: "87 passed" followed by VACUOUS-GREEN GUARD). The guard is
      # right to refuse to certify what it cannot see, so this step does not ask
      # it to.
      - name: Deterministic end-to-end smoke
        if: needs.changes.outputs.zero_key == 'true'
        env:
          ELIZA_UI_SMOKE_SHARD: ${{ matrix.shard }}/6
        run: bun run --cwd packages/app test:e2e

      - name: No affected e2e shard
        if: needs.changes.outputs.zero_key != 'true'
        run: echo "No deterministic E2E lane is affected."

  # The desktop and cloud lanes are whole-lane work that does not shard. Held
  # off the matrix so no shard carries them: on run 31489483093 the cloud step
  # alone added 15.2 minutes to shard 1 and made it the straggler at 45.5
  # minutes while every sibling finished under 37.
  smoke_lanes:
    name: Smoke lanes
    needs: changes
    runs-on: ubuntu-24.04
    # The full Cloud suite now starts a fresh Linux process per file to avoid
    # Bun's isolate stdio leak, then this job runs the unshardable UI gates.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.cloud == 'true' || needs.changes.outputs.zero_key == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # The dev server resolves @elizaos/core's workspace deps (e.g.
      # @elizaos/cloud-routing) from their built dist/, and the frozen
      # --ignore-scripts install never builds them. Turbo builds core plus its
      # dependency graph, matching the prelude in dev-smoke.yml.
      - name: Build @elizaos/core and workspace deps
        if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.cloud != 'true' && needs.changes.outputs.zero_key != 'true'
        run: bunx turbo run build --filter=@elizaos/core --filter=@elizaos/shared

      # test:cloud reaches further than the desktop prelude: cloud service suites
      # import @elizaos/plugin-sql and @elizaos/plugin-workflow from their built
      # dist/, which the core+shared filter never produces. Run 31489483093 is
      # what surfaced it -- the step had been skipped on develop long enough that
      # "Cannot find module '@elizaos/plugin-sql'" read as a new failure.
      # build:core is a superset of the desktop prelude, so it replaces the
      # narrow build rather than running alongside it.
      - name: Build core contract
        if: needs.changes.outputs.cloud == 'true' || needs.changes.outputs.zero_key == 'true'
        run: bun run build:core

      - name: Desktop startup smoke
        if: needs.changes.outputs.desktop == 'true'
        run: bun run test:dev-startup

      - name: Cloud tests
        if: needs.changes.outputs.cloud == 'true'
        run: bun run test:cloud

      # @elizaos/ui#test:e2e launches a real Chromium. It used to inherit the
      # browsers the shard job installs for packages/app; now that it runs here
      # it needs its own, or it dies at browserType.launch (run 31516767405).
      # packages/ui is the install cwd its own gates use (ui-e2e-gate.yml).
      - name: Install Playwright browsers
        if: needs.changes.outputs.zero_key == 'true'
        run: PLAYWRIGHT_INSTALL_CWD=packages/ui .github/scripts/install-playwright-browsers.sh chromium

      # The complement of the shard job's work: the 16 e2e tasks that cannot be
      # sharded, run once instead of once per shard. These are vitest-backed, so
      # --require-work has real reports to reconcile here.
      - name: Deterministic end-to-end smoke (unshardable tasks)
        if: needs.changes.outputs.zero_key == 'true'
        run: bun run test:e2e --filter='^(?!.*packages/app\)#test:e2e)'

      - name: No affected smoke lane
        if: needs.changes.outputs.desktop != 'true' && needs.changes.outputs.cloud != 'true' && needs.changes.outputs.zero_key != 'true'
        run: echo "No desktop, cloud, or deterministic E2E lane is affected."

  android_aab:
    name: Android release AAB
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Validate Android selection
        id: selection
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          ANDROID_SELECTED: ${{ needs.changes.outputs.android_aab }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            echo "::error::CI path classification concluded $CLASSIFIER_RESULT"
            exit 1
          fi
          case "$ANDROID_SELECTED" in
            true|false) echo "selected=$ANDROID_SELECTED" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Android selector must be exactly true or false, got '$ANDROID_SELECTED'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.selection.outputs.selected == 'true'
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Java 21
        if: steps.selection.outputs.selected == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        if: steps.selection.outputs.selected == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: ./.github/actions/setup-bun-workspace
        if: steps.selection.outputs.selected == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "true"
          run-postinstall: "true"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Build mobile package dependencies
        if: steps.selection.outputs.selected == 'true'
        run: |
          bun run --cwd packages/prompts build:package
          bun run build:core
          bun run --cwd packages/ui build
          bun run --cwd packages/vault build
          bun run --cwd packages/agent build:mobile

      - name: Verify mobile bundle initialization is synchronous
        if: steps.selection.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle="packages/agent/dist-mobile/agent-bundle.js"
          test -s "$bundle"
          if grep -qE 'var init_eliza\b[^=]*= __esm\(async ' "$bundle"; then
            echo "::error::init_eliza re-emitted as async __esm"
            exit 1
          fi

      - name: Build and audit canonical Android Cloud release AAB
        if: steps.selection.outputs.selected == 'true'
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -euo pipefail
          bun run --cwd packages/app build:android:cloud 2>&1 \
            | tee "$RUNNER_TEMP/android-cloud-release-aab-audit.log"

      - name: Verify release AAB audit evidence
        id: release-aab-evidence
        if: ${{ always() && !cancelled() && steps.selection.outputs.selected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="packages/app-core/platforms/android/app/build/outputs/bundle/release/app-release.aab"
          AUDIT_LOG="$RUNNER_TEMP/android-cloud-release-aab-audit.log"
          ATTESTATION="$RUNNER_TEMP/android-cloud-release-attestation.json"
          SHA256="$RUNNER_TEMP/android-cloud-release-aab.sha256"
          test -s "$AAB_PATH"
          test -s "$AUDIT_LOG"
          node - "$AUDIT_LOG" "$ATTESTATION" "$AAB_PATH" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const [logPath, outputPath, aabPath] = process.argv.slice(2);
          const prefix = "[mobile-build] android-cloud AAB attestation ";
          const line = fs
            .readFileSync(logPath, "utf8")
            .split(/\r?\n/)
            .filter((candidate) => candidate.startsWith(prefix))
            .at(-1);
          if (!line) throw new Error("release AAB attestation was not emitted");
          const attestation = JSON.parse(line.slice(prefix.length));
          if (attestation.bundletool?.version !== "1.18.3") {
            throw new Error("release AAB attestation has the wrong bundletool version");
          }
          const bytes = fs.readFileSync(aabPath);
          const digest = crypto.createHash("sha256").update(bytes).digest("hex");
          if (
            attestation.artifact?.sha256 !== digest ||
            attestation.artifact?.sizeBytes !== bytes.byteLength
          ) {
            throw new Error("release AAB attestation does not match the artifact");
          }
          fs.writeFileSync(outputPath, `${JSON.stringify(attestation, null, 2)}\n`);
          NODE
          sha256sum "$AAB_PATH" | tee "$SHA256"
          test -s "$ATTESTATION"
          test -s "$SHA256"

      - name: Upload verified release AAB evidence
        if: ${{ always() && !cancelled() && steps.release-aab-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-cloud-release-aab-audit
          path: |
            packages/app-core/platforms/android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/android-cloud-release-aab-audit.log
            ${{ runner.temp }}/android-cloud-release-aab.sha256
            ${{ runner.temp }}/android-cloud-release-attestation.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload Android failure diagnostics
        if: ${{ always() && !cancelled() && steps.selection.outputs.selected == 'true' && steps.release-aab-evidence.outcome != 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-cloud-release-aab-failure-diagnostics
          path: ${{ runner.temp }}/android-cloud-release-aab-audit.log
          retention-days: 3
          if-no-files-found: warn

  secrets:
    # Post-merge scan of commits introduced by the develop push.
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          # Version and SHA256 are pinned in the shared installer
          # (.github/scripts/install-gitleaks.sh); bump them there.
          ./.github/scripts/install-gitleaks.sh "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan changed commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --redact \
            --no-banner \
            --log-opts "$range"

  browser_bridge_windows_security:
    name: Browser bridge Windows security
    uses: ./.github/workflows/browser-bridge-windows-security.yml

  required:
    name: All Tests Passed
    if: ${{ always() && !cancelled() }}
    needs:
      [
        changes,
        quality,
        tests,
        tests_server,
        tests_client,
        tests_plugins,
        smoke,
        smoke_lanes,
        android_aab,
        secrets,
        browser_bridge_windows_security,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            quality=${{ needs.quality.result }}
            tests-scripts=${{ needs.tests.result }}
            tests-server=${{ needs.tests_server.result }}
            tests-client=${{ needs.tests_client.result }}
            tests-plugins=${{ needs.tests_plugins.result }}
            smoke=${{ needs.smoke.result }}
            smoke-lanes=${{ needs.smoke_lanes.result }}
            android-aab=${{ needs.android_aab.result }}
            secrets=${{ needs.secrets.result }}
            browser-bridge-windows-security=${{ needs.browser_bridge_windows_security.result }}
        run: |
          set -euo pipefail
          for pair in $RESULTS; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error title=CI aggregate::$name finished with $result"
              exit 1
            fi
          done
