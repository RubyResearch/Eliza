      - name: Ensure generated shared i18n data
        run: node packages/app-core/scripts/ensure-shared-i18n-data.mjs

      - name: Install Playwright Chromium + WebKit
        run: .github/scripts/install-playwright-browsers.sh chromium webkit

      - name: Actual app assistant pill browser coverage
        run: bun run --cwd packages/app test:e2e test/ui-smoke/assistant-home-flow.spec.ts --project=chromium -g "captures first-run, assistant home, chat suppression, and view pill states"

      - name: Actual app assistant composer browser coverage
        run: bun run --cwd packages/app test:e2e test/ui-smoke/assistant-home-flow.spec.ts --project=chromium -g "morphs the home mic into send and submits a typed turn"

      - name: Actual app TTS and STT browser coverage
        run: bun run --cwd packages/app test:e2e test/ui-smoke/tts-stt-e2e.spec.ts --project=chromium

      - name: Actual app plugin view browser coverage
        run: bun run --cwd packages/app test:e2e test/ui-smoke/plugin-views-visual.spec.ts test/ui-smoke/plugin-views-interaction.spec.ts test/ui-smoke/orchestrator-gui-workbench.spec.ts test/ui-smoke/task-coordinator-gui-interactions.spec.ts --project=chromium

      # WebKit cross-engine pointer/focus lane (#10722): the playwright config's
      # opt-in `webkit` project (Desktop Safari) over the keyless chat
      # pointer/focus/composer specs. Without this step the lane never runs
      # anywhere — Chromium-only coverage ships WebKit-specific regressions to
      # iOS/iPadOS Safari unseen.
      - name: Actual app WebKit pointer/focus coverage
        run: PLAYWRIGHT_WEBKIT=1 bun run --cwd packages/app test:e2e --project=webkit

      - name: Upload zero-key browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-zero-key-browser
          path: |
            packages/app/playwright-report/
